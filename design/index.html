<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CareLoop · Bedside design preview</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #193e34;
        --muted: #53645b;
        --green: #175443;
        --line: #d9e2d8;
        --paper: #f5f7f2;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #e9ede7;
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
        touch-action: manipulation;
      }
      button:focus-visible,
      summary:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #a36512;
        outline-offset: 4px;
      }
      [hidden] {
        display: none !important;
      }
      .preview-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        padding: 16px 24px;
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      .preview-label {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }
      .preview-label b {
        display: block;
        color: var(--ink);
        font-size: 16px;
        font-weight: 600;
      }
      .preview-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .preview-nav button {
        min-height: 44px;
        padding: 10px 15px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: var(--ink);
        font-size: 15px;
      }
      .preview-nav button[aria-pressed="true"] {
        background: var(--ink);
        border-color: var(--ink);
        color: white;
      }
      .tablet {
        max-width: 1000px;
        margin: 32px auto;
        background: var(--paper);
        border: 1px solid #d4ddd1;
        border-radius: 24px;
        padding: 28px 48px 20px;
        box-shadow: 0 14px 50px #1835220a;
      }
      .app-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 34px;
      }
      .brand {
        color: var(--green);
        font-size: 24px;
        font-weight: 650;
        letter-spacing: -0.7px;
      }
      .brand-mark {
        font-size: 29px;
        vertical-align: -2px;
        margin-right: 6px;
      }
      .small-button {
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--green);
        min-height: 48px;
        padding: 10px 12px;
        font-size: 17px;
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      h1 {
        font-size: 38px;
        line-height: 1.2;
        font-weight: 650;
        letter-spacing: -1px;
      }
      .date {
        margin-top: 9px;
        color: var(--muted);
        font-size: 19px;
        line-height: 1.5;
      }
      .patient {
        font-size: 17px;
        color: var(--muted);
      }
      .page-heading {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 16px;
        margin-bottom: 25px;
      }
      .medicine {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 32px;
      }
      .medicine-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .scheduled {
        font-size: 23px;
        font-weight: 550;
      }
      .next-label {
        font-size: 16px;
        color: var(--muted);
      }
      .medicine h2 {
        margin-top: 28px;
        font-size: 38px;
        line-height: 1.25;
        font-weight: 650;
        letter-spacing: -0.8px;
        overflow-wrap: anywhere;
      }
      .dose {
        margin-top: 8px;
        font-size: 28px;
        line-height: 1.4;
      }
      .primary,
      .secondary {
        display: block;
        width: 100%;
        min-height: 70px;
        padding: 18px 24px;
        border-radius: 12px;
        font-size: 25px;
        font-weight: 600;
        line-height: 1.3;
      }
      .primary {
        background: var(--green);
        border: 2px solid var(--green);
        color: #fff;
      }
      .primary:hover {
        background: #103f32;
      }
      .secondary {
        min-height: 58px;
        padding: 14px 20px;
        background: #fff;
        border: 1px solid #b9cbb9;
        color: var(--ink);
        font-size: 21px;
        font-weight: 500;
      }
      .medicine .primary {
        margin-top: 30px;
      }
      .medicine .secondary {
        margin-top: 12px;
      }
      .later {
        margin-top: 32px;
      }
      .later h2 {
        font-size: 23px;
        line-height: 1.4;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .later-row {
        display: flex;
        align-items: center;
        gap: 25px;
        padding: 19px 0;
        border-bottom: 1px solid var(--line);
      }
      .later-row time {
        min-width: 120px;
        font-size: 21px;
        font-variant-numeric: tabular-nums;
      }
      .later-row span {
        font-size: 22px;
      }
      .history-button {
        margin-top: 22px;
      }
      .status {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        padding: 20px 24px;
        margin-bottom: 24px;
        background: #e3edde;
        border: 1px solid #c5d9bc;
        border-radius: 12px;
        font-size: 21px;
        line-height: 1.4;
      }
      .status button {
        border: 0;
        background: transparent;
        color: var(--ink);
        text-decoration: underline;
        min-height: 44px;
        padding: 8px 12px;
        font-size: 19px;
      }
      .taken {
        color: var(--green);
        font-size: 22px;
        padding: 24px 0 4px;
        font-weight: 600;
      }
      .subtle {
        font-size: 16px;
        line-height: 1.5;
        color: var(--muted);
        margin-top: 12px;
      }
      .confirm-name {
        font-size: 34px !important;
        margin-top: 0 !important;
      }
      .time-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        border-top: 1px solid var(--line);
        margin-top: 28px;
        padding-top: 22px;
      }
      .time-row .label {
        font-size: 17px;
        color: var(--muted);
        margin-bottom: 7px;
      }
      .time-row .value {
        font-size: 27px;
        line-height: 1.4;
      }
      .time-editor {
        margin-top: 20px;
      }
      label {
        display: block;
        font-size: 19px;
        line-height: 1.5;
      }
      input,
      select {
        display: block;
        width: 100%;
        min-height: 56px;
        padding: 12px;
        margin-top: 8px;
        border: 1px solid #b9cbb9;
        border-radius: 8px;
        background: white;
        color: var(--ink);
        font-size: 23px;
      }
      .helper-row {
        margin-top: 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .helper-row span {
        font-size: 17px;
        color: var(--muted);
      }
      .confirm-actions {
        margin-top: 26px;
      }
      .confirm-actions .primary {
        margin: 0;
      }
      .confirm-actions .secondary {
        margin-top: 12px;
      }
      .tools {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .tool {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
        min-height: 102px;
        padding: 25px;
        text-align: left;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: white;
        color: var(--ink);
        font-size: 24px;
        font-weight: 550;
      }
      .tool span[aria-hidden] {
        font-size: 26px;
        font-weight: 400;
      }
      .tool:hover {
        border-color: var(--green);
      }
      .tool:active,
      .secondary:active {
        background: #edf3e7;
      }
      .back-row {
        margin-bottom: 24px;
      }
      .back {
        border: 1px solid #bdcdbb;
        border-radius: 9px;
        background: #fff;
        color: var(--ink);
        min-height: 52px;
        padding: 12px 19px;
        font-size: 20px;
      }
      .tool-details {
        margin-top: 24px;
      }
      .tool-details h2 {
        font-size: 24px;
        margin-bottom: 12px;
      }
      .tool-details p {
        font-size: 20px;
        line-height: 1.6;
      }
      .tool-details .secondary {
        margin-top: 12px;
        text-align: left;
      }
      .app-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        padding-top: 25px;
        margin-top: 8px;
        color: var(--muted);
        font-size: 14px;
      }
      .app-footer button {
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 14px;
        min-height: 44px;
        padding: 10px 0 10px 15px;
        text-decoration: underline;
      }
      .privacy {
        font-size: 15px;
        color: var(--muted);
        line-height: 1.6;
        max-width: 750px;
        margin-top: 10px;
      }
      .review-note {
        max-width: 1000px;
        margin: 0 auto 28px;
        padding: 0 20px;
        color: var(--muted);
        font-size: 14px;
        text-align: center;
        line-height: 1.5;
      }
      @media (min-width: 1000px) {
        .patient-layout {
          display: grid;
          grid-template-columns: minmax(0, 1.55fr) minmax(250px, 1fr);
          gap: 30px;
          align-items: start;
        }
        .later {
          margin-top: 0;
          padding-top: 5px;
        }
        .confirmation {
          max-width: 620px;
          margin: 0 auto;
        }
      }
      @media (max-width: 700px) {
        .tablet {
          margin: 0;
          border: 0;
          border-radius: 0;
          padding: 20px;
          box-shadow: none;
        }
        .preview-bar {
          padding: 12px 16px;
        }
        .preview-nav {
          width: 100%;
        }
        .preview-nav button {
          flex: 1;
          padding: 10px;
          font-size: 14px;
        }
        .app-top {
          margin-bottom: 28px;
        }
        .brand {
          font-size: 22px;
        }
        .small-button {
          font-size: 16px;
          padding: 10px 7px;
        }
        h1 {
          font-size: 34px;
        }
        .patient {
          font-size: 16px;
        }
        .page-heading {
          align-items: start;
        }
        .medicine {
          padding: 24px 20px;
        }
        .medicine h2 {
          font-size: 34px;
        }
        .scheduled {
          font-size: 22px;
        }
        .primary {
          font-size: 24px;
          padding: 17px 15px;
        }
        .secondary {
          font-size: 20px;
        }
        .tools {
          grid-template-columns: 1fr;
          gap: 12px;
        }
        .tool {
          min-height: 78px;
          padding: 21px;
          font-size: 23px;
        }
        .later-row {
          gap: 18px;
        }
        .later-row time {
          min-width: 108px;
          font-size: 20px;
        }
        .later-row span {
          font-size: 21px;
        }
        .time-row {
          flex-wrap: wrap;
        }
        .review-note {
          padding: 20px;
          margin: 0;
          background: var(--paper);
        }
        .app-footer {
          margin-top: 16px;
        }
      }
    </style>
  </head>
  <body>
    <header class="preview-bar">
      <div class="preview-label">
        <b>CareLoop design preview</b>Fictional data · no records are saved
      </div>
      <nav class="preview-nav" aria-label="Preview screens">
        <button type="button" data-screen="today" aria-pressed="true">
          Patient home
        </button>
        <button type="button" data-screen="confirm" aria-pressed="false">
          Confirmation
        </button>
        <button type="button" data-screen="caregiver" aria-pressed="false">
          Caregiver menu
        </button>
      </nav>
    </header>
    <main class="tablet" aria-label="Proposed bedside interface">
      <header class="app-top">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">✳</span>CareLoop
        </div>
        <button type="button" class="small-button" id="caregiver-link">
          For caregivers
        </button>
      </header>
      <div id="screen"></div>
      <footer class="app-footer">
        <span>Saved on this tablet</span
        ><button
          type="button"
          id="privacy-button"
          aria-expanded="false"
          aria-controls="privacy-note"
        >
          Privacy
        </button>
      </footer>
      <p class="privacy" id="privacy-note" hidden>
        Your care record stays on this tablet. Anyone using this browser can
        open it. Exported backups and calendars are separate copies.
      </p>
    </main>
    <p class="review-note">
      Layout review only. The working CareLoop app is unchanged.
    </p>
    <script>
      const screen = document.querySelector("#screen");
      let view = "today",
        taken = false,
        time = "08:00",
        helper = "Hoa",
        helperOptions = false,
        editTime = false;
      const esc = (value) =>
        String(value).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const displayTime = (value) => {
        const [hour, minute] = value.split(":").map(Number);
        return `${hour % 12 || 12}:${String(minute).padStart(2, "0")} ${hour >= 12 ? "PM" : "AM"}`;
      };
      function render() {
        document
          .querySelectorAll("[data-screen]")
          .forEach((button) =>
            button.setAttribute(
              "aria-pressed",
              String(button.dataset.screen === view),
            ),
          );
        document.querySelector("#caregiver-link").hidden = view !== "today";
        if (view === "today")
          screen.innerHTML = `
        <div class="page-heading"><div><h1>Today</h1><p class="date">Sunday, October 25</p></div><span class="patient">Hoa’s care</span></div>
        ${taken ? `<div class="status" role="status"><span>✓ Taken at ${displayTime(time)}</span><button type="button" data-action="undo">Undo</button></div>` : ""}
        <div class="patient-layout">
          <section class="medicine" aria-labelledby="medicine-name">
            <div class="medicine-header"><time class="scheduled">8:00 AM</time><span class="next-label">${taken ? "Recorded" : "Next medicine"}</span></div>
            <h2 id="medicine-name">Example A</h2><p class="dose">10 mg</p>
            ${taken ? `<p class="taken">✓ Taken</p><p class="subtle">Recorded by ${esc(helper)}</p><button type="button" class="secondary" data-action="edit-entry">Change entry</button>` : `<button type="button" class="primary" data-action="taken">Mark as taken</button><button type="button" class="secondary" data-action="not-yet">Not yet</button><p class="subtle" id="not-yet-note" role="status" hidden>Still on your list.</p>`}
          </section>
          <section class="later" aria-labelledby="later-title"><h2 id="later-title">Later today</h2><div class="later-row"><time>8:30 AM</time><span>Check weight</span></div><div class="later-row"><time>6:00 PM</time><span>Example B</span></div><button type="button" class="secondary history-button" data-action="history">Today’s history</button><div id="history" class="tool-details" hidden>${taken ? `<p>Example A · 10 mg<br>Taken at ${displayTime(time)}</p>` : "<p>Nothing recorded yet.</p>"}</div></section>
        </div>`;
        if (view === "confirm")
          screen.innerHTML = `
        <div class="confirmation"><div class="back-row"><button type="button" class="back" data-action="back">← Back</button></div><div class="page-heading"><h1>Mark as taken?</h1></div>
          <section class="medicine"><h2 class="confirm-name">Example A</h2><p class="dose">10 mg</p>
            <div class="time-row"><div><p class="label">Taken at</p><p class="value">${displayTime(time)}</p></div><button type="button" class="small-button" data-action="change-time">Change time</button></div>
            ${editTime ? `<div class="time-editor"><label>When did you take it?<input type="time" id="taken-time" value="${time}"></label></div>` : ""}
            <div class="helper-row"><span>Recorded by ${esc(helper)}</span><button type="button" class="small-button" data-action="change-helper">${helper === "Hoa" ? "Someone helped" : "Change"}</button></div>
            ${helperOptions ? `<label class="time-editor">Who helped?<select id="helper" aria-label="Who helped?"><option ${helper === "Hoa" ? "selected" : ""}>Hoa</option><option ${helper === "Lan" ? "selected" : ""}>Lan</option><option ${helper === "Minh" ? "selected" : ""}>Minh</option></select></label>` : ""}
            <div class="confirm-actions"><button type="button" class="primary" data-action="save">Save as taken</button><button type="button" class="secondary" data-action="back">Go back</button></div>
          </section>
        </div>`;
        if (view === "caregiver")
          screen.innerHTML = `
        <div class="back-row"><button type="button" class="back" data-action="back">← Back to Today</button></div><div class="page-heading"><h1>For caregivers</h1></div>
        <div class="tools"><button type="button" class="tool" data-tool="medicines">Medicines<span aria-hidden="true">›</span></button><button type="button" class="tool" data-tool="history">Previous days<span aria-hidden="true">›</span></button><button type="button" class="tool" data-tool="people">People helping<span aria-hidden="true">›</span></button><button type="button" class="tool" data-tool="settings">Backup &amp; settings<span aria-hidden="true">›</span></button></div><section id="tool-detail" class="tool-details" aria-live="polite" hidden></section>`;
      }
      function show(viewName) {
        view = viewName;
        render();
        window.scrollTo({ top: 0, behavior: "instant" });
      }
      document
        .querySelectorAll("[data-screen]")
        .forEach((button) =>
          button.addEventListener("click", () => show(button.dataset.screen)),
        );
      document
        .querySelector("#caregiver-link")
        .addEventListener("click", () => show("caregiver"));
      document
        .querySelector("#privacy-button")
        .addEventListener("click", (event) => {
          const note = document.querySelector("#privacy-note");
          note.hidden = !note.hidden;
          event.currentTarget.setAttribute(
            "aria-expanded",
            String(!note.hidden),
          );
        });
      screen.addEventListener("click", (event) => {
        const action = event.target.closest("[data-action]")?.dataset.action;
        if (action === "taken" || action === "edit-entry") {
          editTime = false;
          helperOptions = false;
          show("confirm");
        }
        if (action === "back") show("today");
        if (action === "not-yet")
          document.querySelector("#not-yet-note").hidden = false;
        if (action === "change-time") {
          editTime = !editTime;
          render();
          document.querySelector("#taken-time")?.focus();
        }
        if (action === "change-helper") {
          helperOptions = !helperOptions;
          render();
          document.querySelector("#helper")?.focus();
        }
        if (action === "save") {
          taken = true;
          show("today");
        }
        if (action === "undo") {
          taken = false;
          show("today");
        }
        if (action === "history") {
          const history = document.querySelector("#history");
          history.hidden = !history.hidden;
        }
        const tool = event.target.closest("[data-tool]")?.dataset.tool;
        if (tool) {
          const detail = document.querySelector("#tool-detail");
          detail.hidden = false;
          detail.innerHTML = {
            medicines:
              "<h2>Medicines</h2><p>Example A · 10 mg<br>Example B · 20 mg</p>",
            history: "<h2>Previous days</h2><p>Saturday, October 24</p>",
            people:
              "<h2>People helping</h2><p>Hoa · Patient<br>Lan · Daughter<br>Minh · Son</p>",
            settings:
              "<h2>Backup &amp; settings</h2><p>Save a backup<br>Restore a backup<br>Tablet settings</p>",
          }[tool];
        }
      });
      screen.addEventListener("change", (event) => {
        if (event.target.id === "taken-time" && event.target.value) {
          time = event.target.value;
          render();
        }
        if (event.target.id === "helper") {
          helper = event.target.value;
          helperOptions = false;
          render();
        }
      });
      render();
    </script>
  </body>
</html>
